<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Voice Assistant</h1>
        <div class="status" id="status">Click the microphone to start</div>
        <button id="mic-btn" class="mic-btn">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <div class="transcript" id="transcript"></div>
        <div class="response" id="response"></div>
        <div class="commands">
            <h3>Try saying:</h3>
            <ul>
                <li>"Add buy groceries to my todo list"</li>
                <li>"List my todos"</li>
                <li>"Complete buy groceries"</li>
                <li>"Delete buy groceries"</li>
                <li>"Remind me to call mom at 5pm"</li>
                <li>"List my reminders"</li>
                <li>"Schedule a meeting at 3pm"</li>
                <li>"Show my calendar"</li>
            </ul>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
